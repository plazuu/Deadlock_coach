# Run one-off commands:
#   docker compose run --rm limpet sync
#   docker compose run --rm limpet matches --limit 10
#
# `docker compose up -d` runs `limpet watch` as a long-lived poller (see the
# `command` below) — restart-safe, stops cleanly on SIGTERM. No desktop
# notifications in this mode (no display in the container); check
# digests/YYYY-MM-DD.md in the volume, or `docker compose logs -f`.

services:
  limpet:
    build: .
    image: limpet:latest
    env_file:
      - path: .env
        required: false
    environment:
      LIMPET_DATA_DIR: /data
    volumes:
      - limpet-data:/data
    # Default command polls for new matches; override on the CLI for one-offs.
    command: ["watch"]
    restart: unless-stopped

volumes:
  limpet-data:
